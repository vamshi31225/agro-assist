<html lang="en"><head></head><body>﻿



    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="css.css">




    <header>
        <h1 data-i18n="contact_us"> Contact Us</h1>
    </header>

    <nav>
        <a href="index.html" data-i18n="home">Home</a>
        <a href="dashboard.html" data-i18n="dashboard">Dashboard</a>
        <a href="advisory.html" data-i18n="crop_advisory">Crop Advisory</a>
        <a href="schemes.html" data-i18n="schemes_1">Schemes</a>
        <a href="booking.html" data-i18n="equipment_booking">Equipment Booking</a>
        <a href="contact.html" data-i18n="contact_1">Contact</a>
    
            <select class="langSwitcher" onchange="switchLanguage(this.value)" style="margin-left:15px; padding:6px 12px; border-radius:5px; background:#fff; color:#2e7d32; border:1px solid #2e7d32; font-weight:bold; cursor:pointer;">
                <option value="en">EN</option>
                <option value="te">తెలుగు</option>
            </select>
        </nav>

    <div class="container">

        <label data-i18n="name">Name</label>
        <input type="text" id="name" placeholder="Your Name" data-i18n-placeholder="your_name_ph" data-voice="true">

        <label data-i18n="email">Email</label>
        <input type="email" id="email" placeholder="Email" data-i18n-placeholder="email_ph">

        <label data-i18n="message">Message</label>
        <textarea id="message" placeholder="Your Message" data-i18n-placeholder="your_message_ph"></textarea>

        <button onclick="submitForm()" data-i18n="submit">Submit</button>

    </div>

    <footer>Support Farmers </footer>

    <script>
        function submitForm() {
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const message = document.getElementById("message").value;

            if (!name || !email || !message) {
                alert("Please fill all fields!");
                return;
            }

            alert("Thank you for contacting us, " + name + "!");
        }
    </script>







    <script src="i18n.js"></script>
    <script src="voice.js"></script>
</body></html>
